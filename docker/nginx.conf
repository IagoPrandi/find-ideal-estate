server {
    listen 80;

    # Rotas do site de conteúdo Astro SSG (páginas públicas de bairros, comparativos, etc.)
    location ~ ^/(bairros|comparar|dados|relatorios|metodologia|sobre)(/|$) {
        root /usr/share/nginx/html/content;
        try_files $uri $uri/index.html =404;
    }

    # Arquivos estáticos do Astro (sitemap, robots, llms, assets do content)
    location ~ ^/(sitemap|robots\.txt|llms\.txt|_astro) {
        root /usr/share/nginx/html/content;
        try_files $uri =404;
    }

    # React SPA — hash routing, serve index.html para qualquer rota restante
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri /index.html;
    }
}
