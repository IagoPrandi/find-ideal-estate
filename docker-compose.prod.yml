# Sobrescreve docker-compose.yml para produção.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: !override
      - "127.0.0.1:8000:8000"
    depends_on: !override
      redis:
        condition: service_healthy
    environment: !override
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-${VITE_MAPTILER_API_KEY:-local-dev-key}}
      VALHALLA_URL: ${VALHALLA_URL:-http://host.docker.internal:8002}
      OTP_URL: ${OTP_URL:-http://otp:8080}
    volumes: []

  worker:
    profiles: !reset []
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment: !override
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-${VITE_MAPTILER_API_KEY:-local-dev-key}}
      VALHALLA_URL: ${VALHALLA_URL:-http://host.docker.internal:8002}
      OTP_URL: ${OTP_URL:-http://otp:8080}
      WORKER_QUEUES: ${WORKER_QUEUES:-transport,zones,enrichment,scrape_http,deduplication,reports}
      WORKER_CONCURRENCY_DEFAULT: ${WORKER_CONCURRENCY_DEFAULT:-1}
      WORKER_COMBINED_QUEUES: "1"
    volumes: []

  worker-scrape-browser:
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment: !override
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-${VITE_MAPTILER_API_KEY:-local-dev-key}}
      VALHALLA_URL: ${VALHALLA_URL:-http://host.docker.internal:8002}
      OTP_URL: ${OTP_URL:-http://otp:8080}
      WORKER_QUEUES: scrape_browser
      WORKER_INIT_RUNTIME_ON_START: "0"
      WORKER_CONCURRENCY_DEFAULT: ${WORKER_CONCURRENCY_SCRAPE_BROWSER:-1}
    volumes: []

  worker-prewarm:
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment: !override
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-${VITE_MAPTILER_API_KEY:-local-dev-key}}
      VALHALLA_URL: ${VALHALLA_URL:-http://host.docker.internal:8002}
      OTP_URL: ${OTP_URL:-http://otp:8080}
      WORKER_QUEUES: prewarm
      WORKER_INIT_RUNTIME_ON_START: "0"
      WORKER_CONCURRENCY_DEFAULT: ${WORKER_CONCURRENCY_PREWARM:-1}
    volumes: []

  postgres:
    profiles: ["local-managed-data"]
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  ui:
    profiles: !reset []
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/ui.prod.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-${MAPTILER_API_KEY}}
    ports:
      - "127.0.0.1:80:80"
    volumes: []
    command: []
