# Sobrescreve docker-compose.yml para produção.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: !override
      - "127.0.0.1:8000:8000"
    depends_on: !override
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL apontando para o RDS}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
    volumes: []

  worker:
    profiles: !reset []
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL apontando para o RDS}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
    volumes: []

  worker-scrape-browser:
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL apontando para o RDS}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
    volumes: []

  worker-prewarm:
    restart: unless-stopped
    depends_on: !override
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL apontando para o RDS}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
    volumes: []

  postgres:
    profiles: ["local-managed-data"]
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  ui:
    profiles: ["local-ui"]
